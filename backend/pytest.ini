[pytest]
# Configuração do pytest para o projeto Tributec

# Diretório de testes
testpaths = tests

# Padrão de arquivos de teste
python_files = test_*.py *_test.py

# Padrão de classes de teste
python_classes = Test*

# Padrão de funções de teste
python_functions = test_*

# Opções padrão
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-branch
    --no-cov-on-fail
    -p no:warnings

# Markers personalizados
markers =
    unit: Testes unitários
    integration: Testes de integração
    slow: Testes que demoram mais tempo
    database: Testes que precisam de banco de dados
    auth: Testes de autenticação
    cadastro: Testes do módulo de cadastro
    tributario: Testes do módulo tributário
    fiscal: Testes do módulo fiscal

# Configurações de asyncio
asyncio_mode = auto

# Timeout para testes (em segundos)
timeout = 300

# Configuração de log
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Ignorar warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
